services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: polyagent-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Always paper-trading from the web layer.
      POLYAGENT_MODE: "PAPER_TRADING"
    volumes:
      # Mount source for live-reload during development.
      # Comment this out for a fully baked image.
      - ./agent:/app/agent
      - ./config.yaml:/app/config.yaml:ro
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: polyagent-frontend
    ports:
      - "3000:3000"
    environment:
      VITE_API_TARGET: "http://backend:8000"
    volumes:
      - ./web:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped
